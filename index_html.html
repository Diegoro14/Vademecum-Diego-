  <style>
/* ==========================================================================
   VADEMÉCUM · interfaz final
   ========================================================================== */

:root {
  --font-scale: 1rem;
  --font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter',
                 system-ui, 'Segoe UI', sans-serif;

  --bg: #f7f8f9;
  --surface: #ffffff;
  --text-main: #0b2545;
  --text-sub: #4a6280;
  --line: #e3e5e8;
  --line-strong: #cfd3d8;
  --accent: #2f6fe4;

  --glow-1: #2f6fe4;
  --glow-2: #7fb3ff;
  --glow-3: #1b4fb0;
  --glow-soft: rgba(47, 111, 228, 0.12);
  --glow-shadow: rgba(47, 111, 228, 0.5);
  --accent-soft: rgba(47, 111, 228, 0.07);
  --danger: #b23b2e;
  --radius: 10px;

  color-scheme: light;
}

[data-theme="dark"] {
  --bg: #1c2024;
  --surface: #23282d;
  --text-main: #e3e4e2;
  --text-sub: #9aa1a8;
  --line: #2f353b;
  --line-strong: #3b424a;
  --accent: #7fb0ff;

  --glow-1: #7fb0ff;
  --glow-2: #bcd7ff;
  --glow-3: #3f77dd;
  --glow-soft: rgba(127, 176, 255, 0.14);
  --glow-shadow: rgba(127, 176, 255, 0.45);
  --accent-soft: rgba(127, 176, 255, 0.12);
  --danger: #ef8a7f;

  color-scheme: dark;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: var(--font-family);
  -webkit-tap-highlight-color: transparent;
}

html {
  font-size: var(--font-scale);
  -webkit-text-size-adjust: 100%;
}

body {
  min-height: 100vh;
  padding: 40px 24px 96px;
  color: var(--text-main);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  font-size: 0.95rem;
  line-height: 1.6;
}

::selection {
  background: var(--accent);
  color: #fff;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
  border-radius: 4px;
}

.app-container {
  max-width: 720px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 1fr;
  gap: 36px;
}

@media (min-width: 900px) {
  .app-container.pc-mode {
    max-width: 1040px;
    grid-template-columns: 320px 1fr;
    gap: 56px;
    align-items: start;
  }
  .pc-mode .sticky-side {
    position: sticky;
    top: 40px;
  }
}

.header-bar {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  padding: 20px 22px;
  margin-bottom: 30px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.62), rgba(255, 255, 255, 0.16));
  box-shadow: 0 22px 44px -36px rgba(16, 24, 40, 0.5);
  backdrop-filter: blur(18px) saturate(150%);
  -webkit-backdrop-filter: blur(18px) saturate(150%);
}

[data-theme="dark"] .header-bar {
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.075), rgba(255, 255, 255, 0.015));
  box-shadow: 0 22px 44px -32px rgba(0, 0, 0, 0.65);
}

.title-group {
  min-width: 0;
}

.settings-btn {
  flex: none;
  width: 34px;
  height: 34px;
  font-size: 0.95rem;
  color: var(--text-sub);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 8px;
  cursor: pointer;
  transition: color 0.2s ease, border-color 0.2s ease;
}

.settings-btn:hover {
  color: var(--text-main);
  border-color: var(--line-strong);
}

.liquid-card {
  padding: 0;
  margin: 0 0 40px;
  background: none;
  border: none;
  box-shadow: none;
  border-radius: 0;
}

label {
  display: block;
  margin-bottom: 10px;
  font-size: 0.68rem;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-sub);
}

input[type="text"],
input[type="password"] {
  width: 100%;
  padding: 10px 0;
  font-size: 0.95rem;
  color: var(--text-main);
  background: transparent;
  border: none;
  border-bottom: 1px solid var(--line-strong);
  border-radius: 0;
  outline: none;
  transition: border-color 0.2s ease;
}

input::placeholder {
  color: var(--text-sub);
  opacity: 0.8;
}

input[type="text"]:focus,
input[type="password"]:focus {
  border-bottom-color: var(--accent);
}

.target-selector {
  position: relative;
  display: flex;
  gap: 4px;
  margin-bottom: 24px;
  padding: 4px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: none;
  box-shadow: none;
  touch-action: pan-y;
  user-select: none;
  -webkit-user-select: none;
}

.liquid-tab {
  position: relative;
  z-index: 2;
  flex: 1;
  min-width: 0;
  padding: 9px 8px;
  font-size: 0.85rem;
  font-weight: 500;
  white-space: nowrap;
  color: var(--text-sub);
  background: none;
  border: none;
  border-radius: 9px;
  cursor: pointer;
  transition: color 0.25s ease;
}

.liquid-tab:hover {
  color: var(--text-main);
}

.liquid-tab.active,
.liquid-tab.cat.active {
  color: var(--text-main);
  background: none;
  border: none;
  box-shadow: none;
}

.tab-pill {
  position: absolute;
  top: 4px;
  bottom: 4px;
  left: 4px;
  width: 0;
  border-radius: 9px;
  z-index: 1;
  pointer-events: none;
  background: var(--surface);
  box-shadow:
    0 6px 16px -10px rgba(16, 24, 40, 0.45),
    inset 0 1px 0 rgba(255, 255, 255, 0.75);
  transition:
    left 0.45s cubic-bezier(0.25, 1, 0.2, 1.1),
    width 0.45s cubic-bezier(0.25, 1, 0.2, 1.1),
    transform 0.2s ease,
    box-shadow 0.3s ease,
    background 0.3s ease;
}

.tab-pill::after {
  content: "";
  position: absolute;
  inset: 1px;
  border-radius: 8px;
  background: linear-gradient(135deg,
    rgba(255, 255, 255, 0.9) 0%,
    rgba(255, 255, 255, 0.18) 45%,
    rgba(0, 0, 0, 0.05) 100%);
  pointer-events: none;
}

.tab-pill::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 9px;
  padding: 1.5px;
  background: var(--line);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  mask-composite: exclude;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.22s ease;
}

.tab-pill.active-touch {
  transform: scale(0.97);
  background: var(--glow-soft);
  box-shadow: 0 10px 28px -12px var(--glow-shadow);
}

.tab-pill.active-touch::before {
  opacity: 1;
  background: linear-gradient(135deg,
    var(--glow-1) 0%, var(--glow-2) 25%, var(--glow-3) 50%,
    var(--glow-2) 75%, var(--glow-1) 100%);
  background-size: 200% auto;
  animation: iridescence 2.6s linear infinite;
}

@keyframes iridescence {
  0%   { background-position: 0% 50%; }
  50%  { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

[data-theme="dark"] .tab-pill {
  background: #2b3137;
  box-shadow:
    0 6px 16px -8px rgba(0, 0, 0, 0.7),
    inset 0 1px 0 rgba(255, 255, 255, 0.09);
}

[data-theme="dark"] .tab-pill::after {
  background: linear-gradient(135deg,
    rgba(255, 255, 255, 0.16) 0%,
    rgba(255, 255, 255, 0.03) 45%,
    rgba(0, 0, 0, 0.22) 100%);
}

.quick-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 16px 0 24px;
}

.chip {
  padding: 6px 11px;
  font-size: 0.78rem;
  font-weight: 450;
  color: var(--text-sub);
  background: none;
  border: 1px solid var(--line);
  border-radius: 6px;
  cursor: pointer;
  transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
}

.chip:hover {
  color: var(--text-main);
  border-color: var(--line-strong);
  background: var(--accent-soft);
}

.drop-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  padding: 13px 18px;
  font-size: 0.88rem;
  font-weight: 600;
  letter-spacing: 0.01em;
  color: #ffffff;
  background: var(--text-main);
  border: 1px solid rgba(0, 0, 0, 0.12);
  border-radius: var(--radius);
  cursor: pointer;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.14),
    0 12px 26px -18px rgba(16, 24, 40, 0.55);
  transition: opacity 0.18s ease, transform 0.12s ease;
}

[data-theme="dark"] .drop-btn {
  color: #eef1f5;
  background: linear-gradient(180deg, #3a4657 0%, #2b3441 100%);
  border-color: rgba(255, 255, 255, 0.09);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.16),
    0 12px 26px -18px rgba(0, 0, 0, 0.7);
}

.drop-btn:hover {
  opacity: 0.88;
}

.drop-btn:active {
  transform: scale(0.995);
}

.btn-icon {
  width: 16px;
  height: 16px;
  flex: none;
  opacity: 0.9;
}

.btn-secondary {
  flex: 1;
  padding: 9px 12px;
  font-size: 0.82rem;
  font-weight: 500;
  color: var(--text-main);
  text-align: center;
  background: none;
  border: 1px solid var(--line);
  border-radius: 8px;
  cursor: pointer;
  transition: border-color 0.2s ease, background 0.2s ease;
}

.btn-secondary:hover {
  border-color: var(--line-strong);
  background: var(--accent-soft);
}

.btn-secondary.active {
  border-color: var(--accent);
  color: var(--accent);
}

.size-controls {
  display: flex;
  gap: 6px;
}

.size-btn {
  width: 32px;
  height: 32px;
  font-size: 0.95rem;
  color: var(--text-main);
  background: none;
  border: 1px solid var(--line);
  border-radius: 8px;
  cursor: pointer;
}

.size-btn:hover {
  border-color: var(--line-strong);
}

.icon-btn {
  padding: 4px 6px;
  font-size: 0.8rem;
  color: var(--text-sub);
  background: none;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

.icon-btn:hover {
  color: var(--danger);
}

.setting-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 0;
  border-bottom: 1px solid var(--line);
}

.setting-row:last-child {
  border-bottom: none;
}

.setting-label {
  font-size: 0.88rem;
  font-weight: 500;
  color: var(--text-main);
}

.data-toolbar {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

#resultCard {
  margin: 0 0 44px;
}

#resultTitle {
  font-size: 1.55rem !important;
  font-weight: 650 !important;
  letter-spacing: -0.03em !important;
  line-height: 1.2 !important;
  margin-bottom: 24px !important;
}

.badge-tag {
  display: inline-block;
  margin-bottom: 12px;
  padding: 0;
  font-size: 0.66rem;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  border: none;
  border-radius: 0;
  background: none;
}

.badge-human {
  color: var(--accent);
}

.badge-cat {
  color: var(--text-sub);
}

.result-section {
  padding: 20px 0;
  background: none;
  border: none;
  border-top: 1px solid var(--line);
  border-radius: 0;
  box-shadow: none;
}

.result-section h4 {
  display: block;
  margin-bottom: 10px;
  font-size: 0.68rem;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-sub);
}

.result-section div {
  font-size: 0.92rem;
  line-height: 1.65;
  color: var(--text-main);
}

.pharmacy-links-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}

.pharmacy-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 7px 12px;
  font-size: 0.82rem;
  font-weight: 450;
  color: var(--text-main);
  text-decoration: none;
  background: none;
  border: 1px solid var(--line);
  border-radius: 8px;
  box-shadow: none;
  transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
}

.pharmacy-btn:hover {
  color: var(--text-main);
  border-color: var(--brand, var(--accent));
  background: var(--accent-soft);
  padding-left: 12px;
  transform: none;
  box-shadow: none;
}

.pharmacy-btn.cruzverde   { --brand: #00a651; }
.pharmacy-btn.ahumada     { --brand: #d81e2c; }
.pharmacy-btn.salcobrand  { --brand: #1f6fd0; }
.pharmacy-btn.redfarma    { --brand: #5c0c89; }
.pharmacy-btn.tupastilla  { --brand: #4859bd; }

.pharmacy-btn .dot {
  flex: none;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--brand, var(--accent));
  box-shadow: none;
}

.pills-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 4px;
}

.pill-item {
  padding: 5px 10px;
  font-size: 0.8rem;
  font-weight: 450;
  color: var(--text-main);
  background: none;
  border: 1px solid var(--line);
  border-radius: 6px;
  box-shadow: none;
}

.danger-box {
  margin-top: 20px;
  padding: 2px 0 2px 16px;
  font-size: 0.88rem;
  font-weight: 500;
  line-height: 1.55;
  color: var(--danger);
  background: none;
  border: none;
  border-left: 2px solid var(--danger);
  border-radius: 0;
  box-shadow: none;
  animation: none;
}

.disclaimer-note {
  margin-top: 28px;
  padding-top: 16px;
  font-size: 0.7rem;
  font-weight: 450;
  line-height: 1.5;
  text-align: left;
  color: var(--text-sub);
  background: none;
  border: none;
  border-top: 1px solid var(--line);
  border-radius: 0;
}

.history-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 0;
  padding: 14px 0;
  background: none;
  border: none;
  border-bottom: 1px solid var(--line);
  border-radius: 0;
  cursor: pointer;
  box-shadow: none;
  transition: color 0.2s ease;
}

.history-item:first-child {
  border-top: 1px solid var(--line);
}

.history-item:hover {
  background: none;
  border-color: var(--line);
  transform: none;
  box-shadow: none;
}

.history-item strong {
  font-weight: 550 !important;
}

.history-actions {
  display: flex;
  gap: 4px;
}

.loader {
  display: none;
  margin: 0 0 32px;
  padding: 0 0 18px;
  font-size: 0.8rem;
  font-weight: 500;
  letter-spacing: 0.02em;
  color: var(--text-sub);
  border-bottom: 1px solid var(--line);
  border-radius: 0;
  background: none;
  box-shadow: none;
}

.loader-spinner {
  width: 100%;
  height: 1px;
  margin: 0 0 10px;
  border-radius: 0;
  background: linear-gradient(90deg, transparent, var(--text-sub), transparent);
  background-size: 40% 100%;
  background-repeat: no-repeat;
  -webkit-mask: none;
  mask: none;
  animation: sweep 1.1s ease-in-out infinite;
}

@keyframes sweep {
  0%   { background-position: -40% 0; }
  100% { background-position: 140% 0; }
}

#fileInput {
  display: none;
}

.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
}

.modal-overlay.active {
  opacity: 1;
  pointer-events: auto;
}

.modal-box {
  width: 90%;
  max-width: 420px;
  padding: 24px;
  text-align: left;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: none;
  transform: none;
}

.modal-box p {
  margin-bottom: 20px;
  font-size: 0.9rem;
  line-height: 1.6;
  color: var(--text-main);
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}
  </style>

<body>
<input type="file" id="fileInput" accept=".json" onchange="importData(event)" />

  <div class="modal-overlay" id="settingsModal">
    <div class="modal-box" style="max-width: 420px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h3 style="font-weight:600; font-size:1.05rem; letter-spacing:-0.01em;">⚙️ Ajustes del Sistema</h3>
        <button class="icon-btn" onclick="closeSettings()" style="font-size:1.1rem;">✕</button>
      </div>

      <div style="text-align:left; margin-bottom:16px;">
        <label for="apiKey">Llave de API (Gemini Key)</label>
        <input type="password" id="apiKey" placeholder="Pega tu clave Gemini aquí..." />
      </div>

      <div class="setting-row">
        <span class="setting-label">Tema Visual</span>
        <button class="btn-secondary" style="flex:initial; padding:8px 16px;" onclick="toggleTheme()">
          <span id="themeIcon">🌙 Oscuro</span>
        </button>
      </div>

      <div class="setting-row">
        <span class="setting-label">Tamaño de Texto / Interfaz</span>
        <div class="size-controls">
          <button class="size-btn" onclick="changeFontSize(-1)">-</button>
          <button class="size-btn" onclick="changeFontSize(1)">+</button>
        </div>
      </div>

      <div class="setting-row">
        <span class="setting-label">Modo Pantalla Ancha</span>
        <button class="btn-secondary" id="pcModeBtn" style="flex:initial; padding:8px 16px;" onclick="togglePCMode()">
          💻 Alternar
        </button>
      </div>

      <div style="margin-top:16px; text-align:left;">
        <label>Respaldo de Datos</label>
        <div class="data-toolbar">
          <button class="btn-secondary" onclick="exportData()">📥 Exportar JSON</button>
          <button class="btn-secondary" onclick="document.getElementById('fileInput').click()">📤 Importar</button>
        </div>
      </div>

      <button class="drop-btn" style="margin-top:20px;" onclick="saveSettings()">Guardar Ajustes</button>
    </div>
  </div>

  <div class="modal-overlay" id="customModal">
    <div class="modal-box">
      <p id="modalMessage">Mensaje del sistema</p>
      <button class="drop-btn" onclick="closeModal()">Entendido</button>
    </div>
  </div>

  <div class="app-container" id="appContainer">
    
    <div class="sticky-side">
      
      <div class="header-bar">
        <div class="title-group">
          <h1 style="font-size:1.65rem; font-weight:650; color:var(--text-main); letter-spacing:-0.04em; line-height:1.1;">Vademécum</h1>
          <p style="font-size:0.8rem; color:var(--text-sub); font-weight:450;">Farmacología Clínica</p>
        </div>

        <button class="settings-btn" onclick="openSettings()" title="Ajustes">
          ⚙️
        </button>
      </div>

      <div class="liquid-card">
        <form id="searchForm" onsubmit="searchMedication(event)">
          <label>Especie / Paciente</label>
          <div class="target-selector" role="tablist" aria-label="Especie objetivo">
            <div class="tab-pill" id="tabPill" aria-hidden="true"></div>
            <button type="button" class="liquid-tab active" id="tabHumano" role="tab" aria-selected="true" onclick="selectTarget('Humano')">👤 Humano</button>
            <button type="button" class="liquid-tab cat" id="tabGato" role="tab" aria-selected="false" onclick="selectTarget('Gato')">🐶🐱 Perros y Gatos</button>
          </div>

          <label for="medName">Medicamento o Principio Activo</label>
          <input type="text" id="medName" placeholder="Ej: Paracetamol, Gabapentina..." />

          <div class="quick-chips" id="quickChipsContainer"></div>

          <button type="submit" class="drop-btn">
            Consultar Vademécum
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"
                 aria-hidden="true" focusable="false">
              <rect x="5" y="3" width="14" height="18" rx="2.6" />
              <path d="M8.6 3v18" />
              <path d="M13.6 7.2v5.2M11 9.8h5.2" />
            </svg>
          </button>
        </form>
      </div>

    </div>

    <div>
      <div class="loader" id="loader">
        <div class="loader-spinner"></div>
        Escurriendo información farmacológica con IA...
      </div>

      <div class="liquid-card" id="resultCard" style="display:none;">
        <div id="resultBadge" class="badge-tag"></div>
        <h2 id="resultTitle" style="font-size:1.6rem; font-weight:800; margin-bottom:16px; letter-spacing:-0.5px;"></h2>
        <div id="resultContent"></div>
      </div>

      <div class="liquid-card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
          <label style="margin-bottom:0;">Historial de Consultas</label>
          <button class="icon-btn" onclick="clearHistory()" title="Limpiar historial">🗑️ Limpiar</button>
        </div>
        <div id="historyList"></div>
      </div>

    </div>

  </div>

  <script>
    let currentTarget = 'Humano';
    let fontSizes = ['0.85rem', '0.95rem', '1.05rem', '1.15rem', '1.25rem'];
    let currentFontIdx = 2;
    let isPCMode = false;

    function escapeHTML(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    const popularMeds = {
      Humano: ['Paracetamol', 'Ibuprofeno', 'Omeprazol', 'Amoxicilina', 'Clonazepam', 'Loratadina', 'Ketorolaco'],
      Gato: ['Gabapentina', 'Meloxicam', 'Prednisolona', 'Amoxicilina + Ac. Clavulánico', 'Metamizol', 'Ondansetrón']
    };

    function renderQuickChips() {
      const container = document.getElementById('quickChipsContainer');
      const meds = popularMeds[currentTarget];
      container.innerHTML = meds.map(med => `
        <button type="button" class="chip" onclick="selectQuickMed('${escapeHTML(med)}')">${escapeHTML(med)}</button>
      `).join('');
    }

    function selectQuickMed(med) {
      document.getElementById('medName').value = med;
      searchMedication();
    }

    function toggleTheme() {
      const current = document.body.getAttribute('data-theme');
      const next = current === 'light' ? 'dark' : 'light';
      document.body.setAttribute('data-theme', next);
      document.getElementById('themeIcon').innerText = next === 'light' ? '☀️ Claro' : '🌙 Oscuro';
      localStorage.setItem('vademecum_theme', next);
    }

    function changeFontSize(direction) {
      currentFontIdx = Math.max(0, Math.min(fontSizes.length - 1, currentFontIdx + direction));
      document.documentElement.style.setProperty('--font-scale', fontSizes[currentFontIdx]);
      localStorage.setItem('vademecum_font_size', fontSizes[currentFontIdx]);
    }

    function togglePCMode() {
      isPCMode = !isPCMode;
      const container = document.getElementById('appContainer');
      const btn = document.getElementById('pcModeBtn');
      container.classList.toggle('pc-mode', isPCMode);
      btn.classList.toggle('active', isPCMode);
      localStorage.setItem('vademecum_pcmode', isPCMode);
    }

    function openSettings() {
      document.getElementById('settingsModal').classList.add('active');
    }

    function closeSettings() {
      document.getElementById('settingsModal').classList.remove('active');
    }

    function saveSettings() {
      const key = document.getElementById('apiKey').value.trim();
      if (key) {
        localStorage.setItem('gemini_api_key', key);
      }
      closeSettings();
      showModal('Ajustes guardados correctamente.');
    }

    document.addEventListener('DOMContentLoaded', () => {
      const savedTheme = localStorage.getItem('vademecum_theme') || 'light';
      document.body.setAttribute('data-theme', savedTheme);
      document.getElementById('themeIcon').innerText = savedTheme === 'light' ? '☀️ Claro' : '🌙 Oscuro';

      const savedFont = localStorage.getItem('vademecum_font_size');
      if (savedFont) {
        document.documentElement.style.setProperty('--font-scale', savedFont);
        currentFontIdx = fontSizes.indexOf(savedFont) !== -1 ? fontSizes.indexOf(savedFont) : 2;
      }

      if (localStorage.getItem('vademecum_pcmode') === 'true') {
        togglePCMode();
      }

      const savedKey = localStorage.getItem('gemini_api_key');
      if (savedKey) {
        document.getElementById('apiKey').value = savedKey;
      }

      renderQuickChips();
      renderHistory();
      initTabPill();
    });

    function selectTarget(target) {
      currentTarget = target;
      const isHuman = target === 'Humano';
      const tabH = document.getElementById('tabHumano');
      const tabG = document.getElementById('tabGato');
      
      tabH.classList.toggle('active', isHuman);
      tabH.setAttribute('aria-selected', isHuman);
      
      tabG.classList.toggle('active', !isHuman);
      tabG.setAttribute('aria-selected', !isHuman);
      
      renderQuickChips();
      positionTabPill();
    }

    const tabSelector = document.querySelector('.target-selector');
    const tabPill = document.getElementById('tabPill');
    let pillDrag = false, pillStartX = 0, pillStartLeft = 0, pillMoved = false;

    function positionTabPill(animate = true) {
      if (!tabSelector || !tabPill) return;
      const active = tabSelector.querySelector('.liquid-tab.active');
      if (!active) return;
      tabPill.style.transition = animate ? '' : 'none';
      tabPill.style.left = active.offsetLeft + 'px';
      tabPill.style.width = active.offsetWidth + 'px';
    }

    function initTabPill() {
      if (!tabSelector || !tabPill) return;
      positionTabPill(false);

      window.addEventListener('resize', () => positionTabPill(false));

      tabSelector.addEventListener('pointerdown', (e) => {
        if (e.button !== undefined && e.button !== 0) return;
        pillDrag = true;
        pillMoved = false;
        pillStartX = e.clientX;
        pillStartLeft = tabPill.offsetLeft;
        tabPill.style.transition = 'none';
        tabPill.classList.add('active-touch');
      });

      tabSelector.addEventListener('pointermove', (e) => {
        if (!pillDrag) return;
        const dx = e.clientX - pillStartX;
        if (Math.abs(dx) > 6) pillMoved = true;
        const max = tabSelector.clientWidth - tabPill.offsetWidth - 4;
        tabPill.style.left = Math.max(0, Math.min(pillStartLeft + dx, max)) + 'px';
      });

      const endDrag = () => {
        if (!pillDrag) return;
        pillDrag = false;
        tabPill.classList.remove('active-touch');
        tabPill.style.transition = '';

        const tabs = [...tabSelector.querySelectorAll('.liquid-tab')];
        const center = tabPill.offsetLeft + tabPill.offsetWidth / 2;
        let best = tabs[0], bestDist = Infinity;
        for (const t of tabs) {
          const d = Math.abs(t.offsetLeft + t.offsetWidth / 2 - center);
          if (d < bestDist) { bestDist = d; best = t; }
        }
        selectTarget(best.id === 'tabGato' ? 'Gato' : 'Humano');
      };

      tabSelector.addEventListener('pointerup', endDrag);
      tabSelector.addEventListener('pointercancel', endDrag);

      tabSelector.addEventListener('click', (e) => {
        if (pillMoved) {
          e.preventDefault();
          e.stopPropagation();
          pillMoved = false;
        }
      }, true);
    }

    async function searchMedication(e) {
      if (e) e.preventDefault();
      const apiKey = localStorage.getItem('gemini_api_key') || document.getElementById('apiKey').value.trim();
      const medName = document.getElementById('medName').value.trim();

      if (!apiKey) {
        openSettings();
        showModal('Por favor ingresa y guarda tu llave de API de Gemini en Ajustes.');
        return;
      }
      if (!medName) {
        showModal('Ingresa el nombre del medicamento o principio activo.');
        return;
      }

      const cacheKey = `${currentTarget.toLowerCase()}_${medName.toLowerCase()}`;
      const cachedData = localStorage.getItem(`med_${cacheKey}`);

      if (cachedData && !navigator.onLine) {
        displayResult(JSON.parse(cachedData));
        return;
      }

      document.getElementById('loader').style.display = 'block';
      document.getElementById('resultCard').style.display = 'none';

      const esVeterinario = currentTarget === 'Gato';
      const speciesLabel = esVeterinario
        ? 'PERROS Y GATOS (medicina veterinaria; indica explícitamente cuándo la dosis, la presentación o la toxicidad difieren entre perro y gato)'
        : 'HUMANO';
      const roleLabel = esVeterinario
        ? 'farmacéutico experto y veterinario clínico'
        : 'farmacéutico experto y especialista clínico';

      const prompt = `Actúa como ${roleLabel}. Proporciona una ficha de vademécum clara, precisa y detallada para el medicamento "${medName}" enfocado strictly en uso para: ${speciesLabel}.
Contexto de mercado: Chile.

Responde ÚNICAMENTE en JSON estricto sin bloques de formato markdown ni comentarios extra:
{
  "nombre": "Nombre comercial y Principio activo",
  "paraQueSirve": "Explicación breve de sus indicaciones principales.",
  "presentaciones": ["Lista de presentaciones con dosis e.g. 'Comprimidos 500 mg', 'Cápsulas 300 mg', 'Jarabe / Suspensión 120 mg/5ml', 'Gotas orales'"],
  "farmaceuticas": ["Marcas/Laboratorios disponibles en Chile e.g. 'Mintlab', 'Laboratorio Chile', 'Saval', 'Sanitas', 'Recalcine', 'Genfar'"],
  "formatoPrincipal": "comprimido, capsula, jarabe o gotas (sólo una de estas opciones)",
  "dosisYUso": "Indicaciones generales de uso o administración común.",
  "precauciones": "Contraindicaciones y efectos secundarios clave.",
  "alertaGato": "Si la consulta es veterinaria (perros o gatos) y existe peligro severo o toxicidad para alguna de las dos especies (ej: Paracetamol en gatos, Ivermectina en perros Collie), detállalo indicando la especie afectada. Si es Humano dejar vacío."
}`;

      const modelsToTry = [
        'gemini-2.5-flash-lite',
        'gemini-2.5-flash',
        'gemini-flash-lite-latest',
        'gemini-flash-latest'
      ];

      let data = null;
      let firstErrorMessage = '';

      for (const model of modelsToTry) {
        try {
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
          });

          const resData = await response.json();

          if (response.ok && resData.candidates && resData.candidates[0]) {
            data = resData;
            break;
          } else if (resData.error) {
            if (!firstErrorMessage) {
              firstErrorMessage = (resData.error.status ? resData.error.status + ': ' : '') +
                                  (resData.error.message || '');
            }
          }
        } catch (err) {
          if (!firstErrorMessage) firstErrorMessage = err.message;
        }
      }

      try {
        if (!data) {
          const hint = /quota|429|exceeded/i.test(firstErrorMessage)
            ? ' Se agotó la cuota gratuita por ahora; espera un rato o usa otra clave.'
            : '';
          showModal(`Error de API: ${firstErrorMessage || 'Verifica que tu API Key sea correcta y tenga permisos habilitados.'}${hint}`);
          return;
        }

        const parts = (data.candidates[0].content && data.candidates[0].content.parts) || [];
        const textPart = parts.find(part => part.text && !part.thought) || parts[0];
        let rawText = (textPart && textPart.text) || '';
        const jsonMatch = rawText.match(/\{[\s\S]*\}/);
        if (!jsonMatch) {
          throw new Error("Respuesta no contiene un formato JSON válido");
        }
        
        const medInfo = JSON.parse(jsonMatch[0]);
        medInfo.paciente = currentTarget;
        medInfo.busqueda = medName;

        localStorage.setItem(`med_${cacheKey}`, JSON.stringify(medInfo));
        saveToHistory(medInfo);
        displayResult(medInfo);
      } catch (err) {
        showModal('Error al procesar la respuesta del servidor. Intenta de nuevo.');
      } finally {
        document.getElementById('loader').style.display = 'none';
      }
    }

    function displayResult(data) {
      document.getElementById('resultTitle').innerText = data.nombre || '';
      const badge = document.getElementById('resultBadge');
      badge.innerHTML = data.paciente === 'Gato' ? '🐶🐱 Uso Veterinario' : '👤 Uso Humano';
      badge.className = `badge-tag ${data.paciente === 'Gato' ? 'badge-cat' : 'badge-human'}`;

      const presentacionesHtml = Array.isArray(data.presentaciones) && data.presentaciones.length > 0
        ? data.presentaciones.map(p => `<span class="pill-item">💊 ${escapeHTML(p)}</span>`).join('')
        : '<span class="pill-item">Consulte en farmacia disponibilidad local</span>';

      const farmaceuticasHtml = Array.isArray(data.farmaceuticas) && data.farmaceuticas.length > 0
        ? data.farmaceuticas.map(f => `<span class="pill-item">🏢 ${escapeHTML(f)}</span>`).join('')
        : '<span class="pill-item">Genéricos y Marcas Varias</span>';

      const searchKeyword = encodeURIComponent(data.busqueda || data.nombre);
      const pharmacyLinksHtml = `
        <div class="pharmacy-links-grid">
          <a href="https://www.cruzverde.cl/search?query=${searchKeyword}" target="_blank" class="pharmacy-btn cruzverde" rel="noopener noreferrer">
            <span class="dot" aria-hidden="true"></span> Cruz Verde ↗
          </a>
          <a href="https://www.farmaciasahumada.cl/catalogsearch/result/?q=${searchKeyword}" target="_blank" class="pharmacy-btn ahumada" rel="noopener noreferrer">
            <span class="dot" aria-hidden="true"></span> Ahumada ↗
          </a>
          <a href="https://salcobrand.cl/search_result?query=${searchKeyword}" target="_blank" class="pharmacy-btn salcobrand" rel="noopener noreferrer">
            <span class="dot" aria-hidden="true"></span> Salcobrand ↗
          </a>
          <a href="https://www.redfarma.cl/productos/?nombre=${searchKeyword}&pagina=1" target="_blank" class="pharmacy-btn redfarma" rel="noopener noreferrer">
            <span class="dot" aria-hidden="true"></span> Redfarma ↗
          </a>
          <a href="https://www.farmacompara.cl/search?q=${searchKeyword}" target="_blank" class="pharmacy-btn tupastilla" rel="noopener noreferrer">
            <span class="dot" aria-hidden="true"></span> Comparador ↗
          </a>
        </div>
      `;

      let html = `
        <div class="result-section">
          <h4>🛒 Buscar y Comparar Precios en Chile</h4>
          ${pharmacyLinksHtml}
        </div>

        <div class="result-section">
          <h4>💊 Formatos y Miligramos Disponibles</h4>
          <div class="pills-grid">${presentacionesHtml}</div>
        </div>

        <div class="result-section">
          <h4>🏢 Laboratorios / Farmacéuticas Comercializadoras</h4>
          <div class="pills-grid">${farmaceuticasHtml}</div>
        </div>

        <div class="result-section">
          <h4>💡 ¿Para qué sirve?</h4>
          <div>${escapeHTML(data.paraQueSirve)}</div>
        </div>

        <div class="result-section">
          <h4>📋 Indicaciones y Uso</h4>
          <div>${escapeHTML(data.dosisYUso)}</div>
        </div>

        <div class="result-section">
          <h4>⚠️ Precauciones</h4>
          <div>${escapeHTML(data.precauciones)}</div>
        </div>
      `;

      if (data.alertaGato && data.alertaGato.length > 5) {
        html += `<div class="danger-box"><strong>🚨 ALERTA VETERINARIA:</strong> ${escapeHTML(data.alertaGato)}</div>`;
      }

      html += `<div class="disclaimer-note">⚠️ Información de referencia generada por IA. No sustituye la consulta médica ni la prescripción profesional.</div>`;

      document.getElementById('resultContent').innerHTML = html;
      document.getElementById('resultCard').style.display = 'block';
    }

    function saveToHistory(data) {
      let history = JSON.parse(localStorage.getItem('vademecum_history') || '[]');
      history = history.filter(i => i.busqueda.toLowerCase() !== data.busqueda.toLowerCase() || i.paciente !== data.paciente);
      history.unshift(data);
      localStorage.setItem('vademecum_history', JSON.stringify(history));
      renderHistory();
    }

    function renderHistory() {
      const history = JSON.parse(localStorage.getItem('vademecum_history') || '[]');
      const container = document.getElementById('historyList');
      if (history.length === 0) {
        container.innerHTML = '<p style="color:var(--text-sub); font-size:0.85rem; text-align:center; padding:10px;">No hay consultas guardadas aún.</p>';
        return;
      }
      container.innerHTML = history.map((item, index) => `
        <div class="history-item">
          <div onclick='loadFromHistory(${index})' style="flex:1; cursor:pointer;">
            <strong style="font-size:0.92rem; display:block; margin-bottom:2px;">${escapeHTML(item.nombre)}</strong>
            <span style="font-size:0.75rem; color:var(--text-sub);">${item.paciente === 'Gato' ? '🐶🐱 Perros y Gatos' : '👤 Humano'} • ${escapeHTML(item.busqueda)}</span>
          </div>
          <div class="history-actions">
            <button class="icon-btn" onclick="deleteHistoryItem(event, ${index})" title="Eliminar">🗑️</button>
          </div>
        </div>
      `).join('');
    }

    function loadFromHistory(index) {
      const history = JSON.parse(localStorage.getItem('vademecum_history') || '[]');
      if (history[index]) {
        displayResult(history[index]);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function deleteHistoryItem(e, index) {
      e.stopPropagation();
      let history = JSON.parse(localStorage.getItem('vademecum_history') || '[]');
      history.splice(index, 1);
      localStorage.setItem('vademecum_history', JSON.stringify(history));
      renderHistory();
    }

    function clearHistory() {
      localStorage.removeItem('vademecum_history');
      renderHistory();
    }

    function exportData() {
      const history = localStorage.getItem('vademecum_history') || '[]';
      const blob = new Blob([history], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Vademecum_Respaldo_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        try {
          const imported = JSON.parse(event.target.result);
          if (Array.isArray(imported)) {
            localStorage.setItem('vademecum_history', JSON.stringify(imported));
            renderHistory();
            showModal('¡Respaldo importado con éxito!');
          } else {
            showModal('El archivo JSON no tiene un formato válido.');
          }
        } catch (err) {
          showModal('Error al leer el archivo JSON.');
        }
      };
      reader.readAsText(file);
    }

    function showModal(msg) {
      document.getElementById('modalMessage').innerText = msg;
      document.getElementById('customModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('customModal').classList.remove('active');
    }
  </script>
</body>
</html>
