<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="theme-color" content="#f5f5f7" />
  <title>Vademécum</title>
  
  <!-- Iconos para GitHub Pages y PWA -->
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512x512.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icon-512x512.png">

  <!-- PWA Manifest -->
  <link rel="manifest" href='data:application/json;charset=utf-8,%7B%22name%22%3A%22Vadem%C3%A9cum%22%2C%22short_name%22%3A%22Vadem%C3%A9cum%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23f5f5f7%22%2C%22theme_color%22%3A%22%23f5f5f7%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22icon-512x512.png%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fpng%22%2C%22purpose%22%3A%22any%20maskable%22%7D%5D%7D'>

  <style>
/* ==========================================================================
   VADEMÉCUM · Apple Design System & Fluid Motion
   ========================================================================== */

:root {
  --font-scale: 1rem;
  --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
                 "Helvetica Neue", Helvetica, Arial, sans-serif;

  --bg: #f5f5f7;
  --surface: rgba(255, 255, 255, 0.72);
  --surface-solid: #ffffff;
  --text-main: #1d1d1f;
  --text-sub: #86868b;
  --line: rgba(0, 0, 0, 0.08);
  --line-strong: rgba(0, 0, 0, 0.18);
  --accent: #0071e3;
  --accent-active: #005bb5;

  --glow-soft: rgba(0, 113, 227, 0.08);
  --glow-shadow: rgba(0, 113, 227, 0.25);
  --accent-soft: rgba(0, 113, 227, 0.08);
  --danger: #ff3b30;
  --radius-lg: 20px;
  --radius-md: 14px;
  --radius-sm: 10px;

  /* Easing curves matching Apple iOS/macOS physics */
  --ease-apple: cubic-bezier(0.25, 1, 0.5, 1);
  --ease-spring: cubic-bezier(0.175, 0.885, 0.32, 1.175);

  color-scheme: light;
}

[data-theme="dark"] {
  --bg: #000000;
  --surface: rgba(28, 28, 30, 0.72);
  --surface-solid: #1c1c1e;
  --text-main: #f5f5f7;
  --text-sub: #a1a1a6;
  --line: rgba(255, 255, 255, 0.12);
  --line-strong: rgba(255, 255, 255, 0.24);
  --accent: #0a84ff;
  --accent-active: #409cff;

  --glow-soft: rgba(10, 132, 255, 0.14);
  --glow-shadow: rgba(10, 132, 255, 0.35);
  --accent-soft: rgba(10, 132, 255, 0.12);
  --danger: #ff453a;

  color-scheme: dark;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: var(--font-family);
  -webkit-tap-highlight-color: transparent;
}

html {
  font-size: var(--font-scale);
  -webkit-text-size-adjust: 100%;
}

body {
  min-height: 100vh;
  padding: 32px 20px 80px;
  color: var(--text-main);
  background-color: var(--bg);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-size: 0.95rem;
  line-height: 1.47059;
  letter-spacing: -0.022em;
}

::selection {
  background: var(--accent);
  color: #fff;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
  border-radius: 6px;
}

.app-container {
  max-width: 680px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 1fr;
  gap: 28px;
}

@media (min-width: 900px) {
  .app-container.pc-mode {
    max-width: 1020px;
    grid-template-columns: 340px 1fr;
    gap: 40px;
    align-items: start;
  }
  .pc-mode .sticky-side {
    position: sticky;
    top: 32px;
  }
}

/* Glassmorphism Surface Header */
.header-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 18px 22px;
  margin-bottom: 24px;
  border: 1px solid var(--line);
  border-top: 1px solid rgba(255, 255, 255, 0.3);
  border-radius: var(--radius-lg);
  background: var(--surface);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  transition: transform 0.3s var(--ease-apple), box-shadow 0.3s var(--ease-apple);
}

.title-group {
  min-width: 0;
}

.settings-btn {
  flex: none;
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1rem;
  color: var(--text-sub);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 50%;
  cursor: pointer;
  transition: transform 0.2s var(--ease-apple), background-color 0.2s ease, border-color 0.2s ease;
}

.settings-btn:hover {
  color: var(--text-main);
  border-color: var(--line-strong);
  transform: scale(1.05);
}

.settings-btn:active {
  transform: scale(0.92);
}

.liquid-card {
  padding: 24px;
  margin-bottom: 28px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-top: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: var(--radius-lg);
  box-shadow: 0 4px 24px rgba(0, 0, 0, 0.03);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  transition: transform 0.3s var(--ease-apple), box-shadow 0.3s var(--ease-apple);
}

label {
  display: block;
  margin-bottom: 8px;
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-sub);
}

input[type="text"],
input[type="password"] {
  width: 100%;
  padding: 12px 14px;
  font-size: 0.95rem;
  color: var(--text-main);
  background: rgba(0, 0, 0, 0.03);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  outline: none;
  transition: border-color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
}

[data-theme="dark"] input[type="text"],
[data-theme="dark"] input[type="password"] {
  background: rgba(255, 255, 255, 0.05);
}

input::placeholder {
  color: var(--text-sub);
  opacity: 0.7;
}

input[type="text"]:focus,
input[type="password"]:focus {
  border-color: var(--accent);
  background: transparent;
  box-shadow: 0 0 0 3px var(--glow-soft);
}

/* Apple Segmented Control */
.target-selector {
  position: relative;
  display: flex;
  gap: 2px;
  margin-bottom: 20px;
  padding: 3px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: rgba(0, 0, 0, 0.04);
  touch-action: pan-y;
  user-select: none;
  -webkit-user-select: none;
}

[data-theme="dark"] .target-selector {
  background: rgba(255, 255, 255, 0.06);
}

.liquid-tab {
  position: relative;
  z-index: 2;
  flex: 1;
  min-width: 0;
  padding: 8px 12px;
  font-size: 0.85rem;
  font-weight: 500;
  text-align: center;
  color: var(--text-sub);
  background: none;
  border: none;
  border-radius: 99px;
  cursor: pointer;
  transition: color 0.2s ease;
}

.liquid-tab.active {
  color: var(--text-main);
  font-weight: 600;
}

.tab-pill {
  position: absolute;
  top: 3px;
  bottom: 3px;
  left: 3px;
  width: 0;
  border-radius: 9px;
  z-index: 1;
  pointer-events: none;
  background: var(--surface-solid);
  box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12), 0 1px 2px rgba(0, 0, 0, 0.08);
  transition: left 0.3s var(--ease-apple), width 0.3s var(--ease-apple), transform 0.15s ease;
}

/* Buttons */
.drop-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  padding: 12px 20px;
  font-size: 0.9rem;
  font-weight: 500;
  color: #ffffff;
  background: var(--accent);
  border: none;
  border-radius: 980px; /* Capsule style */
  cursor: pointer;
  box-shadow: 0 4px 14px var(--glow-shadow);
  transition: transform 0.2s var(--ease-apple), background-color 0.2s ease, box-shadow 0.2s ease;
}

.drop-btn:hover {
  background-color: var(--accent-active);
  box-shadow: 0 6px 20px var(--glow-shadow);
}

.drop-btn:active {
  transform: scale(0.96);
}

.btn-icon {
  width: 16px;
  height: 16px;
  flex: none;
}

.btn-secondary {
  flex: 1;
  padding: 8px 14px;
  font-size: 0.85rem;
  font-weight: 500;
  color: var(--text-main);
  text-align: center;
  background: rgba(0, 0, 0, 0.03);
  border: 1px solid var(--line);
  border-radius: 980px;
  cursor: pointer;
  transition: transform 0.2s var(--ease-apple), background 0.2s ease, border-color 0.2s ease;
}

[data-theme="dark"] .btn-secondary {
  background: rgba(255, 255, 255, 0.05);
}

.btn-secondary:hover {
  border-color: var(--line-strong);
  background: var(--accent-soft);
}

.btn-secondary:active {
  transform: scale(0.96);
}

.size-controls {
  display: flex;
  gap: 6px;
}

.size-btn {
  width: 32px;
  height: 32px;
  font-size: 1rem;
  font-weight: 500;
  color: var(--text-main);
  background: rgba(0, 0, 0, 0.03);
  border: 1px solid var(--line);
  border-radius: 50%;
  cursor: pointer;
  transition: transform 0.2s var(--ease-apple), border-color 0.2s ease;
}

.size-btn:active {
  transform: scale(0.92);
}

.icon-btn {
  padding: 6px 8px;
  font-size: 0.85rem;
  color: var(--text-sub);
  background: none;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: color 0.2s ease, transform 0.2s var(--ease-apple);
}

.icon-btn:hover {
  color: var(--danger);
}

.icon-btn:active {
  transform: scale(0.92);
}

.setting-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 0;
  border-bottom: 1px solid var(--line);
}

.setting-row:last-child {
  border-bottom: none;
}

.setting-label {
  font-size: 0.88rem;
  font-weight: 500;
  color: var(--text-main);
}

.data-toolbar {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

#resultCard {
  margin-bottom: 28px;
}

#resultTitle {
  font-size: 1.65rem !important;
  font-weight: 700 !important;
  letter-spacing: -0.025em !important;
  line-height: 1.2 !important;
  margin-bottom: 20px !important;
}

.badge-tag {
  display: inline-block;
  margin-bottom: 10px;
  padding: 4px 10px;
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.02em;
  border-radius: 980px;
  background: var(--accent-soft);
}

.badge-human {
  color: var(--accent);
}

.badge-cat {
  color: #ff9500;
  background: rgba(255, 149, 0, 0.12);
}

.result-section {
  padding: 16px 0;
  border-top: 1px solid var(--line);
}

.result-section h4 {
  margin-bottom: 8px;
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-sub);
}

.result-section div {
  font-size: 0.95rem;
  line-height: 1.5;
  color: var(--text-main);
}

.pharmacy-links-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 10px;
}

.pharmacy-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  font-size: 0.82rem;
  font-weight: 500;
  color: var(--text-main);
  text-decoration: none;
  background: rgba(0, 0, 0, 0.03);
  border: 1px solid var(--line);
  border-radius: 980px;
  transition: transform 0.2s var(--ease-apple), border-color 0.2s ease, background-color 0.2s ease;
}

[data-theme="dark"] .pharmacy-btn {
  background: rgba(255, 255, 255, 0.05);
}

.pharmacy-btn:hover {
  border-color: var(--brand, var(--accent));
  background: var(--accent-soft);
}

.pharmacy-btn:active {
  transform: scale(0.96);
}

.pharmacy-btn.cruzverde   { --brand: #34c759; }
.pharmacy-btn.ahumada     { --brand: #ff3b30; }
.pharmacy-btn.salcobrand  { --brand: #007aff; }
.pharmacy-btn.redfarma    { --brand: #af52de; }
.pharmacy-btn.drsimi      { --brand: #ff9500; }

.pharmacy-btn .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--brand, var(--accent));
}

.pills-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 6px;
}

.pill-item {
  padding: 8px 14px;
  font-size: 0.82rem;
  font-weight: 500;
  color: var(--text-main);
  background: rgba(0, 0, 0, 0.03);
  border: 1px solid var(--line);
  border-radius: 12px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  user-select: none;
  transition: transform 0.2s var(--ease-apple), background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
}

[data-theme="dark"] .pill-item {
  background: rgba(255, 255, 255, 0.05);
}

.pill-item:hover {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent);
}

.pill-item:active {
  transform: scale(0.94);
}

.danger-box {
  margin-top: 20px;
  padding: 14px 16px;
  font-size: 0.88rem;
  font-weight: 500;
  color: var(--danger);
  background: rgba(255, 59, 48, 0.08);
  border-radius: var(--radius-md);
  border-left: 3px solid var(--danger);
}

.disclaimer-note {
  margin-top: 24px;
  padding-top: 14px;
  font-size: 0.72rem;
  color: var(--text-sub);
  border-top: 1px solid var(--line);
}

.history-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
  cursor: pointer;
  transition: background-color 0.2s ease, transform 0.2s var(--ease-apple);
}

.history-item:hover {
  opacity: 0.85;
}

.history-item:active {
  transform: scale(0.99);
}

.history-actions {
  display: flex;
  gap: 4px;
}

/* Apple Pulse Indicator */
.loader {
  display: none;
  margin-bottom: 24px;
  padding: 16px;
  text-align: center;
  font-size: 0.85rem;
  font-weight: 500;
  color: var(--text-sub);
}

.loader-spinner {
  width: 100%;
  height: 2px;
  margin-bottom: 12px;
  border-radius: 2px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  background-size: 200% 100%;
  animation: applePulse 1.5s infinite var(--ease-apple);
}

@keyframes applePulse {
  0%   { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}

#fileInput {
  display: none;
}

/* Apple Floating Sheet Modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, 0.32);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s var(--ease-apple);
}

.modal-overlay.active {
  opacity: 1;
  pointer-events: auto;
}

.modal-box {
  width: 90%;
  max-width: 420px;
  padding: 24px;
  background: var(--surface-solid);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
  transform: scale(0.94) translateY(10px);
  transition: transform 0.3s var(--ease-apple);
}

.modal-overlay.active .modal-box {
  transform: scale(1) translateY(0);
}

.modal-box p {
  margin-bottom: 20px;
  font-size: 0.92rem;
  line-height: 1.5;
  color: var(--text-main);
}

.pharmacy-action-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin: 18px 0;
}

@media (prefers-reduced-motion: reduce) {
  *, ::before, ::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

@media (prefers-reduced-transparency: reduce) {
  .header-bar, .liquid-card, .modal-overlay {
    background: var(--surface-solid) !important;
    backdrop-filter: none !important;
  }
}
  </style>
</head>
<body>
  <input type="file" id="fileInput" accept=".json" onchange="importData(event)" />

  <div class="modal-overlay" id="settingsModal">
    <div class="modal-box">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;">
        <h3 style="font-weight:600; font-size:1.1rem; letter-spacing:-0.02em;">⚙️ Ajustes del Sistema</h3>
        <button class="icon-btn" onclick="closeSettings()" style="font-size:1.1rem;">✕</button>
      </div>

      <div style="text-align:left; margin-bottom:16px;">
        <label for="apiKey">Llave de API (Gemini Key)</label>
        <input type="password" id="apiKey" placeholder="Pega tu clave Gemini aquí..." />
      </div>

      <div class="setting-row">
        <span class="setting-label">Tema Visual</span>
        <button class="btn-secondary" style="flex:initial; padding:6px 14px;" onclick="toggleTheme()">
          <span id="themeIcon">🌙 Oscuro</span>
        </button>
      </div>

      <div class="setting-row">
        <span class="setting-label">Tamaño de Texto</span>
        <div class="size-controls">
          <button class="size-btn" onclick="changeFontSize(-1)">-</button>
          <button class="size-btn" onclick="changeFontSize(1)">+</button>
        </div>
      </div>

      <div class="setting-row">
        <span class="setting-label">Modo Pantalla Ancha</span>
        <button class="btn-secondary" id="pcModeBtn" style="flex:initial; padding:6px 14px;" onclick="togglePCMode()">
          💻 Alternar
        </button>
      </div>

      <div style="margin-top:16px; text-align:left;">
        <label>Respaldo de Datos</label>
        <div class="data-toolbar">
          <button class="btn-secondary" onclick="exportData()">📥 Exportar</button>
          <button class="btn-secondary" onclick="document.getElementById('fileInput').click()">📤 Importar</button>
        </div>
      </div>

      <button class="drop-btn" style="margin-top:24px;" onclick="saveSettings()">Guardar Ajustes</button>
    </div>
  </div>

  <!-- Modal para seleccionar Farmacia específica según la presentación -->
  <div class="modal-overlay" id="presentationModal">
    <div class="modal-box">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h3 style="font-weight:600; font-size:1rem; color:var(--text-main);" id="selectedPresentationTitle">💊 Buscar Presentación</h3>
        <button class="icon-btn" onclick="closePresentationModal()" style="font-size:1.1rem;">✕</button>
      </div>
      <p style="font-size:0.83rem; color:var(--text-sub); margin-bottom:12px;">Selecciona la farmacia para consultar stock y precios de este formato en particular:</p>
      
      <div class="pharmacy-action-list" id="pharmacyActionList"></div>

      <button class="drop-btn" style="margin-top:12px; background:var(--surface); color:var(--text-main); border:1px solid var(--line);" onclick="openAllPharmaciesForPresentation()">
        🌐 Abrir en Farmacompara
      </button>
    </div>
  </div>

  <div class="modal-overlay" id="customModal">
    <div class="modal-box">
      <p id="modalMessage">Mensaje del sistema</p>
      <button class="drop-btn" onclick="closeModal()">Entendido</button>
    </div>
  </div>

  <div class="app-container" id="appContainer">
    
    <div class="sticky-side">
      
      <div class="header-bar">
        <div class="title-group">
          <h1 style="font-size:1.55rem; font-weight:700; color:var(--text-main); letter-spacing:-0.03em; line-height:1.1;">Vademécum</h1>
          <p style="font-size:0.8rem; color:var(--text-sub); font-weight:400; margin-top:2px;">Farmacología Clínica</p>
        </div>

        <button class="settings-btn" onclick="openSettings()" title="Ajustes">
          ⚙️
        </button>
      </div>

      <div class="liquid-card">
        <form id="searchForm" onsubmit="searchMedication(event)">
          <label>Especie / Paciente</label>
          <div class="target-selector" role="tablist" aria-label="Especie objetivo">
            <div class="tab-pill" id="tabPill" aria-hidden="true"></div>
            <button type="button" class="liquid-tab active" id="tabHumano" role="tab" aria-selected="true" onclick="selectTarget('Humano')">👤 Humano</button>
            <button type="button" class="liquid-tab cat" id="tabGato" role="tab" aria-selected="false" onclick="selectTarget('Gato')">🐶🐱 Vet</button>
          </div>

          <label for="medName">Medicamento o Principio Activo</label>
          <input type="text" id="medName" placeholder="Ej: Paracetamol, Gabapentina..." />

          <button type="submit" class="drop-btn" style="margin-top:24px;">
            Consultar Vademécum
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </button>
        </form>
      </div>

      <div class="liquid-card" style="margin-top: -8px;">
        <form id="glossaryForm" onsubmit="searchGlossary(event)">
          <label for="glossaryQuery">📖 Glosario & Consultas Generales</label>
          <input type="text" id="glossaryQuery" placeholder="Ej: ¿Qué es un comprimido sublingual?..." />

          <button type="submit" class="drop-btn" style="margin-top:16px; background: var(--surface-solid); color: var(--text-main); border: 1px solid var(--line);">
            🔍 Buscar Concepto en Web
          </button>
        </form>
      </div>

    </div>

    <div>
      <div class="loader" id="loader">
        <div class="loader-spinner"></div>
        <span id="loaderText">Consultando información farmacológica...</span>
      </div>

      <div class="liquid-card" id="resultCard" style="display:none; position:relative;">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px;">
          <div id="resultBadge" class="badge-tag"></div>
          <button class="icon-btn" onclick="closeResultCard()" title="Cerrar consulta" style="padding:4px 8px; font-weight:600; font-size:1.1rem; border:1px solid var(--line); border-radius:50%; width:32px; height:32px; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,0.03);">
            ✕
          </button>
        </div>
        <h2 id="resultTitle"></h2>
        <div id="resultContent"></div>

        <div style="margin-top:20px; display:flex; gap:10px; justify-content:center;">
          <button class="btn-secondary" onclick="closeResultCard()" style="max-width:200px; font-weight:600;">
            ⬅️ Volver a Consultas
          </button>
        </div>
      </div>

      <div class="liquid-card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
          <label style="margin-bottom:0;">Historial de Consultas</label>
          <button class="icon-btn" onclick="clearHistory()" title="Limpiar historial">🗑️ Limpiar</button>
        </div>

        <!-- Tabs para dividir Historial de Medicamentos y Conceptos con pill animado -->
        <div class="target-selector" style="margin-bottom:12px;" role="tablist" aria-label="Filtro de historial">
          <div class="tab-pill" id="histTabPill" aria-hidden="true"></div>
          <button type="button" class="liquid-tab active" id="histTabMeds" role="tab" aria-selected="true" onclick="switchHistoryTab('meds')">💊 Medicamentos</button>
          <button type="button" class="liquid-tab" id="histTabConcepts" role="tab" aria-selected="false" onclick="switchHistoryTab('concepts')">📖 Conceptos</button>
        </div>

        <div id="historyList"></div>
      </div>

    </div>

  </div>

  <script>
    let currentTarget = 'Humano';
    let currentHistoryTab = 'meds';
    let fontSizes = ['0.85rem', '0.95rem', '1.05rem', '1.15rem', '1.25rem'];
    let currentFontIdx = 1;
    let isPCMode = false;
    let activeSelectedPresentation = '';
    let activeSelectedMedName = '';

    window.addEventListener('DOMContentLoaded', () => {
      loadSettings();
      updateTabPill();
      updateHistTabPill();
      renderHistory();
    });

    function escapeHTML(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function selectTarget(target) {
      currentTarget = target;
      document.getElementById('tabHumano').classList.toggle('active', target === 'Humano');
      document.getElementById('tabHumano').setAttribute('aria-selected', target === 'Humano');
      document.getElementById('tabGato').classList.toggle('active', target === 'Gato');
      document.getElementById('tabGato').setAttribute('aria-selected', target === 'Gato');
      updateTabPill();
    }

    function updateTabPill() {
      const activeTab = document.querySelector('.target-selector .liquid-tab.active:not(#histTabMeds):not(#histTabConcepts)');
      const pill = document.getElementById('tabPill');
      if (activeTab && pill) {
        pill.style.left = `${activeTab.offsetLeft}px`;
        pill.style.width = `${activeTab.offsetWidth}px`;
      }
    }

    function updateHistTabPill() {
      const activeTab = currentHistoryTab === 'meds' 
        ? document.getElementById('histTabMeds') 
        : document.getElementById('histTabConcepts');
      const pill = document.getElementById('histTabPill');
      if (activeTab && pill) {
        pill.style.left = `${activeTab.offsetLeft}px`;
        pill.style.width = `${activeTab.offsetWidth}px`;
      }
    }

    function openSettings() {
      document.getElementById('apiKey').value = localStorage.getItem('gemini_api_key') || '';
      document.getElementById('settingsModal').classList.add('active');
    }

    function closeSettings() {
      document.getElementById('settingsModal').classList.remove('active');
    }

    function saveSettings() {
      const key = document.getElementById('apiKey').value.trim();
      localStorage.setItem('gemini_api_key', key);
      closeSettings();
      showModal('Ajustes guardados correctamente.');
    }

    function toggleTheme() {
      const isDark = document.body.getAttribute('data-theme') === 'dark';
      document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('themeIcon').innerText = isDark ? '🌙 Oscuro' : '☀️ Claro';
      localStorage.setItem('vademecum_theme', isDark ? 'light' : 'dark');
    }

    function changeFontSize(delta) {
      currentFontIdx = Math.max(0, Math.min(fontSizes.length - 1, currentFontIdx + delta));
      document.documentElement.style.setProperty('--font-scale', fontSizes[currentFontIdx]);
      localStorage.setItem('vademecum_font_idx', currentFontIdx);
    }

    function togglePCMode() {
      isPCMode = !isPCMode;
      document.getElementById('appContainer').classList.toggle('pc-mode', isPCMode);
      localStorage.setItem('vademecum_pc_mode', isPCMode);
    }

    function loadSettings() {
      const theme = localStorage.getItem('vademecum_theme') || 'light';
      document.body.setAttribute('data-theme', theme);
      document.getElementById('themeIcon').innerText = theme === 'dark' ? '☀️ Claro' : '🌙 Oscuro';

      const fontIdx = localStorage.getItem('vademecum_font_idx');
      if (fontIdx !== null) {
        currentFontIdx = parseInt(fontIdx, 10);
        document.documentElement.style.setProperty('--font-scale', fontSizes[currentFontIdx]);
      }

      const pcMode = localStorage.getItem('vademecum_pc_mode') === 'true';
      isPCMode = pcMode;
      document.getElementById('appContainer').classList.toggle('pc-mode', isPCMode);
    }

    async function searchMedication(e) {
      if (e) e.preventDefault();
      const apiKey = localStorage.getItem('gemini_api_key') || document.getElementById('apiKey').value.trim();
      const medName = document.getElementById('medName').value.trim();

      if (!apiKey) {
        openSettings();
        showModal('Por favor ingresa y guarda tu llave de API de Gemini en Ajustes.');
        return;
      }
      if (!medName) {
        showModal('Ingresa el nombre del medicamento.');
        return;
      }

      document.getElementById('loaderText').innerText = 'Consultando información farmacológica...';
      document.getElementById('loader').style.display = 'block';
      document.getElementById('resultCard').style.display = 'none';

      const promptText = `Responde estrictamente con un objeto JSON sin formato markdown ni triple backticks.
El paciente es un: ${currentTarget}.
Medicamento a consultar: ${medName}.

Genera la siguiente estructura JSON exacta:
{
  "nombre": "Nombre Comercial / Generico del Medicamento",
  "principio_activo": "Principio Activo Principal",
  "mecanismo": "Explicacion breve y clara de como funciona en el organismo del ${currentTarget}",
  "posologia": "Dosis habituales, frecuencia recomendada e indicaciones clave especificas para ${currentTarget}",
  "contraindicaciones": "Contraindicaciones, efectos adversos o precauciones principales",
  "presentaciones": ["Ejemplo 500 mg x 16 comprimidos", "Ejemplo Jarabe 120ml", "Formato Gotas"],
  "advertencia": "${currentTarget === 'Gato' ? 'ADVERTENCIA TOXICOLOGICA IMPORTANTE si aplica para la especie o un mensaje de atencion veterinaria.' : ''}"
}`;

      const modelsToTry = [
        'gemini-2.5-flash',
        'gemini-2.5-flash-lite',
        'gemini-flash-latest'
      ];

      let jsonResult = null;
      let lastErr = '';

      for (const model of modelsToTry) {
        try {
          const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: promptText }] }]
            })
          });

          const resData = await resp.json();
          if (resp.ok && resData.candidates?.[0]?.content?.parts?.[0]?.text) {
            let rawText = resData.candidates[0].content.parts[0].text.trim();
            rawText = rawText.replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/\s*```$/, '');
            jsonResult = JSON.parse(rawText);
            break;
          } else if (resData.error) {
            lastErr = resData.error.message || 'Error en la respuesta de la API.';
          }
        } catch (err) {
          lastErr = err.message;
        }
      }

      document.getElementById('loader').style.display = 'none';

      if (jsonResult) {
        jsonResult.paciente = currentTarget;
        jsonResult.busqueda = medName;
        saveToHistory(jsonResult);
        displayResult(jsonResult);
      } else {
        showModal(`No se pudo obtener información. ${lastErr ? 'Detalle: ' + lastErr : 'Verifica tu API Key e intenta de nuevo.'}`);
      }
    }

    // Construye URLs de búsqueda directa para cada farmacia chilena.
    // Cada botón abre el buscador interno de la farmacia con el remedio buscado
    // (ya no usamos búsquedas en Google con site:).
    //
    // URLs verificadas con navegador real (2026-10-21):
    //   - Cruz Verde:  /search?query=PARACETAMOL  → muestra "Resultados para PARACETAMOL"
    //                  (con ?q= no filtra; el sitio usa Angular SPA y solo reconoce ?query=)
    //   - Ahumada:     /search?q=PARACETAMOL
    //   - Salcobrand:  /search_result?query=PARACETAMOL
    //   - Redfarma:    /productos/?nombre=PARACETAMOL&pagina=1  → muestra "Resultados Para: paracetamol"
    //   - Dr. Simi:    VTEX, /PARACETAMOL?_q=PARACETAMOL&map=ft
    //   - Farmacompara (comparador): /search?q=PARACETAMOL
    function buildPharmacyUrls(rawSearchTerm) {
      // Limpiar el término: quitar paréntesis, notas y ejemplos
      const cleanTerm = (rawSearchTerm || '').split('(')[0].trim();
      const encoded = encodeURIComponent(cleanTerm);
      // Dr. Simi usa VTEX: el término va en el path y en _q, con map=ft
      const drsimiPath = encodeURIComponent(cleanTerm);
      return {
        cruzverde:    `https://www.cruzverde.cl/search?query=${encoded}`,
        ahumada:      `https://www.farmaciasahumada.cl/search?q=${encoded}`,
        salcobrand:   `https://salcobrand.cl/search_result?query=${encoded}`,
        redfarma:     `https://www.redfarma.cl/productos/?nombre=${encoded}&pagina=1`,
        drsimi:       `https://www.drsimi.cl/${drsimiPath}?_q=${encoded}&map=ft`,
        farmacompara: `https://www.farmacompara.cl/search?q=${encoded}`
      };
    }

    // Abre el comparador de precios farmacompara.cl con el medicamento actual
    // (reemplaza al antiguo "Abrir Todas" que abría Cruz Verde).
    function openAllMainPharmacies() {
      const urls = buildPharmacyUrls(activeSelectedMedName);
      window.open(urls.farmacompara, '_blank');
    }

    function displayResult(data) {
      activeSelectedMedName = data.nombre || data.busqueda;
      document.getElementById('resultTitle').innerText = data.nombre;

      const badge = document.getElementById('resultBadge');
      badge.innerText = data.paciente === 'Gato' ? '🐶🐱 Veterinaria' : '👤 Medicina Humana';
      badge.className = `badge-tag ${data.paciente === 'Gato' ? 'badge-cat' : 'badge-human'}`;

      // URLs de búsqueda directa en cada farmacia chilena (sin Google)
      const pharmUrls = buildPharmacyUrls(data.nombre || data.busqueda);

      const pharmLinks = `
        <div class="result-section">
          <h4>🛒 Buscar en Farmacias de Chile</h4>
          <div class="pharmacy-links-grid">
            <a href="${pharmUrls.cruzverde}" target="_blank" class="pharmacy-btn cruzverde" rel="noopener noreferrer">
              <span class="dot"></span> Cruz Verde ↗
            </a>
            <a href="${pharmUrls.ahumada}" target="_blank" class="pharmacy-btn ahumada" rel="noopener noreferrer">
              <span class="dot"></span> Ahumada ↗
            </a>
            <a href="${pharmUrls.salcobrand}" target="_blank" class="pharmacy-btn salcobrand" rel="noopener noreferrer">
              <span class="dot"></span> Salcobrand ↗
            </a>
            <a href="${pharmUrls.redfarma}" target="_blank" class="pharmacy-btn redfarma" rel="noopener noreferrer">
              <span class="dot"></span> Redfarma ↗
            </a>
            <a href="${pharmUrls.drsimi}" target="_blank" class="pharmacy-btn drsimi" rel="noopener noreferrer">
              <span class="dot"></span> Dr. Simi ↗
            </a>
            <a href="${pharmUrls.farmacompara}" target="_blank" class="pharmacy-btn" style="--brand: #007aff;" rel="noopener noreferrer">
              <span class="dot"></span> Farmacompara ↗
            </a>
          </div>
        </div>
      `;

      let presentacionesHtml = '';
      if (data.presentaciones && data.presentaciones.length > 0) {
        presentacionesHtml = `
          <div class="result-section">
            <h4>📦 Presentaciones & Formatos Compatibles (Toca para buscar)</h4>
            <div class="pills-grid">
              ${data.presentaciones.map(p => `
                <div class="pill-item" onclick="openPresentationModal('${escapeHTML(p)}')">
                  💊 ${escapeHTML(p)}
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      let warningHtml = '';
      if (data.advertencia) {
        warningHtml = `<div class="danger-box">⚠️ ${escapeHTML(data.advertencia)}</div>`;
      }

      const html = `
        <div class="result-section">
          <h4>🧪 Principio Activo</h4>
          <div>${escapeHTML(data.principio_activo)}</div>
        </div>
        <div class="result-section">
          <h4>💡 Mecanismo de Acción</h4>
          <div>${escapeHTML(data.mecanismo)}</div>
        </div>
        <div class="result-section">
          <h4>📋 Posología y Administración (${escapeHTML(data.paciente)})</h4>
          <div>${escapeHTML(data.posologia)}</div>
        </div>
        <div class="result-section">
          <h4>⚠️ Precauciones y Contraindicaciones</h4>
          <div>${escapeHTML(data.contraindicaciones)}</div>
        </div>
        ${presentacionesHtml}
        ${pharmLinks}
        ${warningHtml}
        <div class="disclaimer-note">⚠️ La información presentada es de carácter orientativo. No reemplaza el diagnóstico ni la prescripción médica o veterinaria profesional.</div>
      `;

      document.getElementById('resultContent').innerHTML = html;
      document.getElementById('resultCard').style.display = 'block';
      document.getElementById('resultCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function openPresentationModal(presentationText) {
      activeSelectedPresentation = presentationText;
      document.getElementById('selectedPresentationTitle').innerText = `💊 ${presentationText}`;
      
      // Combinamos el nombre del medicamento con la presentación para refinar la búsqueda
      const baseMed = activeSelectedMedName.split('(')[0].trim();
      const combinedTerm = `${baseMed} ${presentationText}`;
      const pharmUrls = buildPharmacyUrls(combinedTerm);
      
      const listContainer = document.getElementById('pharmacyActionList');
      listContainer.innerHTML = `
        <a href="${pharmUrls.cruzverde}" target="_blank" class="pharmacy-btn cruzverde" rel="noopener noreferrer" style="width:100%; justify-content:flex-start;">
          <span class="dot"></span> Cruz Verde
        </a>
        <a href="${pharmUrls.ahumada}" target="_blank" class="pharmacy-btn ahumada" rel="noopener noreferrer" style="width:100%; justify-content:flex-start;">
          <span class="dot"></span> Farmacias Ahumada
        </a>
        <a href="${pharmUrls.salcobrand}" target="_blank" class="pharmacy-btn salcobrand" rel="noopener noreferrer" style="width:100%; justify-content:flex-start;">
          <span class="dot"></span> Salcobrand
        </a>
        <a href="${pharmUrls.redfarma}" target="_blank" class="pharmacy-btn redfarma" rel="noopener noreferrer" style="width:100%; justify-content:flex-start;">
          <span class="dot"></span> Redfarma
        </a>
        <a href="${pharmUrls.drsimi}" target="_blank" class="pharmacy-btn drsimi" rel="noopener noreferrer" style="width:100%; justify-content:flex-start;">
          <span class="dot"></span> Dr. Simi
        </a>
        <a href="${pharmUrls.farmacompara}" target="_blank" class="pharmacy-btn" style="--brand:#007aff; width:100%; justify-content:flex-start;" rel="noopener noreferrer">
          <span class="dot"></span> Farmacompara
        </a>
      `;

      document.getElementById('presentationModal').classList.add('active');
    }

    function closePresentationModal() {
      document.getElementById('presentationModal').classList.remove('active');
    }

    function openAllPharmaciesForPresentation() {
      const baseMed = activeSelectedMedName.split('(')[0].trim();
      const combinedTerm = `${baseMed} ${activeSelectedPresentation}`;
      const urls = buildPharmacyUrls(combinedTerm);
      // Abrimos el comparador de precios en vez de las 5 farmacias por separado
      window.open(urls.farmacompara, '_blank');
      closePresentationModal();
    }

    function closeResultCard() {
      document.getElementById('resultCard').style.display = 'none';
      document.getElementById('searchForm').scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    async function searchGlossary(e) {
      if (e) e.preventDefault();
      const apiKey = localStorage.getItem('gemini_api_key') || document.getElementById('apiKey').value.trim();
      const query = document.getElementById('glossaryQuery').value.trim();

      if (!apiKey) {
        openSettings();
        showModal('Por favor ingresa y guarda tu llave de API de Gemini en Ajustes.');
        return;
      }
      if (!query) {
        showModal('Ingresa una consulta o término farmacológico.');
        return;
      }

      const cacheKey = `concept_${query.toLowerCase()}`;
      const cachedConcept = localStorage.getItem(cacheKey);

      if (cachedConcept && !navigator.onLine) {
        displayGlossaryResult(JSON.parse(cachedConcept));
        return;
      }

      document.getElementById('loaderText').innerText = 'Consultando concepto farmacológico...';
      document.getElementById('loader').style.display = 'block';
      document.getElementById('resultCard').style.display = 'none';

      const modelsToTry = [
        'gemini-2.5-flash',
        'gemini-2.5-flash-lite',
        'gemini-flash-latest'
      ];

      const promptText = `Explica en detalle, con lenguaje claro, profesional pero fácil de entender para un paciente o tutor de mascota, el siguiente concepto, término médico, formato o duda sobre medicamentos: "${query}". 

Estructura la respuesta de manera limpia usando subtítulos breves o listas con viñetas si es necesario.`;

      let textResult = null;
      let sources = [];
      let lastErr = '';

      try {
        const searchResp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: promptText }] }],
            tools: [{ "google_search": {} }],
            systemInstruction: {
              parts: [{ text: "Eres un farmacéutico explicativo y claro. Explica conceptos médicos y farmacológicos de forma sencilla y precisa." }]
            }
          })
        });

        if (searchResp.ok) {
          const resData = await searchResp.json();
          const candidate = resData.candidates?.[0];
          if (candidate && candidate.content?.parts?.[0]?.text) {
            textResult = candidate.content.parts[0].text;
            const groundingMetadata = candidate.groundingMetadata;
            if (groundingMetadata && groundingMetadata.groundingAttributions) {
              sources = groundingMetadata.groundingAttributions
                .map(attr => ({ uri: attr.web?.uri, title: attr.web?.title }))
                .filter(s => s.uri && s.title);
            }
          }
        }
      } catch (err) {
        console.warn("Falló búsqueda con google_search, intentando modelos estándar...", err);
      }

      if (!textResult) {
        for (const model of modelsToTry) {
          try {
            const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{ parts: [{ text: promptText }] }]
              })
            });

            const resData = await resp.json();
            if (resp.ok && resData.candidates?.[0]?.content?.parts?.[0]?.text) {
              textResult = resData.candidates[0].content.parts[0].text;
              break;
            } else if (resData.error) {
              lastErr = resData.error.message || 'Error en la respuesta de la API.';
            }
          } catch (err) {
            lastErr = err.message;
          }
        }
      }

      document.getElementById('loader').style.display = 'none';

      if (textResult) {
        const conceptData = {
          type: 'concept',
          query: query,
          text: textResult,
          sources: sources,
          timestamp: new Date().toISOString()
        };
        localStorage.setItem(cacheKey, JSON.stringify(conceptData));
        saveConceptToHistory(conceptData);
        displayGlossaryResult(conceptData);
      } else {
        showModal(`No se pudo obtener la explicación. ${lastErr ? 'Detalle: ' + lastErr : 'Verifica tu API Key e intenta de nuevo.'}`);
      }
    }

    function displayGlossaryResult(conceptData) {
      document.getElementById('resultTitle').innerText = conceptData.query;
      const badge = document.getElementById('resultBadge');
      badge.innerText = '📖 Concepto / Consulta';
      badge.className = 'badge-tag badge-human';

      let sourcesHtml = '';
      if (conceptData.sources && conceptData.sources.length > 0) {
        sourcesHtml = `
          <div class="result-section">
            <h4>🔗 Fuentes Web Consultadas</h4>
            <div class="pharmacy-links-grid">
              ${conceptData.sources.map(s => `
                <a href="${escapeHTML(s.uri)}" target="_blank" class="pharmacy-btn" rel="noopener noreferrer">
                  🌐 ${escapeHTML(s.title)} ↗
                </a>
              `).join('')}
            </div>
          </div>
        `;
      }

      let formattedText = escapeHTML(conceptData.text)
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\n\n/g, '<br><br>')
        .replace(/\n/g, '<br>');

      const html = `
        <div class="result-section">
          <h4>💡 Explicación del Concepto</h4>
          <div style="font-size:0.95rem; line-height:1.6; color:var(--text-main);">${formattedText}</div>
        </div>
        ${sourcesHtml}
        <div class="disclaimer-note">⚠️ Información orientativa y educativa. En caso de dudas con tratamientos médicos, consulta con tu médico o farmacéutico.</div>
      `;

      document.getElementById('resultContent').innerHTML = html;
      document.getElementById('resultCard').style.display = 'block';
      document.getElementById('resultCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function switchHistoryTab(tab) {
      currentHistoryTab = tab;
      document.getElementById('histTabMeds').classList.toggle('active', tab === 'meds');
      document.getElementById('histTabMeds').setAttribute('aria-selected', tab === 'meds');
      document.getElementById('histTabConcepts').classList.toggle('active', tab === 'concepts');
      document.getElementById('histTabConcepts').setAttribute('aria-selected', tab === 'concepts');
      updateHistTabPill();
      renderHistory();
    }

    function saveToHistory(data) {
      let history = JSON.parse(localStorage.getItem('vademecum_history') || '[]');
      history = history.filter(i => i.nombre.toLowerCase() !== data.nombre.toLowerCase() || i.paciente !== data.paciente);
      history.unshift(data);
      localStorage.setItem('vademecum_history', JSON.stringify(history));
      if (currentHistoryTab === 'meds') renderHistory();
    }

    function saveConceptToHistory(conceptData) {
      let history = JSON.parse(localStorage.getItem('vademecum_concept_history') || '[]');
      history = history.filter(i => i.query.toLowerCase() !== conceptData.query.toLowerCase());
      history.unshift(conceptData);
      localStorage.setItem('vademecum_concept_history', JSON.stringify(history));
      if (currentHistoryTab === 'concepts') renderHistory();
    }

    function renderHistory() {
      const container = document.getElementById('historyList');

      if (currentHistoryTab === 'meds') {
        const history = JSON.parse(localStorage.getItem('vademecum_history') || '[]');
        if (history.length === 0) {
          container.innerHTML = '<p style="color:var(--text-sub); font-size:0.85rem; text-align:center; padding:10px;">No hay consultas de medicamentos guardadas.</p>';
          return;
        }
        container.innerHTML = history.map((item, index) => `
          <div class="history-item">
            <div onclick='loadFromHistory(${index})' style="flex:1; cursor:pointer;">
              <strong style="font-size:0.9rem; display:block; margin-bottom:2px;">${escapeHTML(item.nombre)}</strong>
              <span style="font-size:0.75rem; color:var(--text-sub);">${item.paciente === 'Gato' ? '🐶🐱 Vet' : '👤 Humano'} • ${escapeHTML(item.busqueda)}</span>
            </div>
            <div class="history-actions">
              <button class="icon-btn" onclick="deleteHistoryItem(event, ${index}, 'meds')" title="Eliminar">🗑️</button>
            </div>
          </div>
        `).join('');
      } else {
        const history = JSON.parse(localStorage.getItem('vademecum_concept_history') || '[]');
        if (history.length === 0) {
          container.innerHTML = '<p style="color:var(--text-sub); font-size:0.85rem; text-align:center; padding:10px;">No hay conceptos consultados guardados.</p>';
          return;
        }
        container.innerHTML = history.map((item, index) => `
          <div class="history-item">
            <div onclick='loadConceptFromHistory(${index})' style="flex:1; cursor:pointer;">
              <strong style="font-size:0.9rem; display:block; margin-bottom:2px;">${escapeHTML(item.query)}</strong>
              <span style="font-size:0.75rem; color:var(--text-sub);">📖 Concepto Explicado</span>
            </div>
            <div class="history-actions">
              <button class="icon-btn" onclick="deleteHistoryItem(event, ${index}, 'concepts')" title="Eliminar">🗑️</button>
            </div>
          </div>
        `).join('');
      }
    }

    function loadFromHistory(index) {
      const history = JSON.parse(localStorage.getItem('vademecum_history') || '[]');
      if (history[index]) {
        displayResult(history[index]);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function loadConceptFromHistory(index) {
      const history = JSON.parse(localStorage.getItem('vademecum_concept_history') || '[]');
      if (history[index]) {
        displayGlossaryResult(history[index]);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function deleteHistoryItem(e, index, type) {
      e.stopPropagation();
      if (type === 'meds') {
        let history = JSON.parse(localStorage.getItem('vademecum_history') || '[]');
        history.splice(index, 1);
        localStorage.setItem('vademecum_history', JSON.stringify(history));
      } else {
        let history = JSON.parse(localStorage.getItem('vademecum_concept_history') || '[]');
        history.splice(index, 1);
        localStorage.setItem('vademecum_concept_history', JSON.stringify(history));
      }
      renderHistory();
    }

    function clearHistory() {
      if (currentHistoryTab === 'meds') {
        localStorage.removeItem('vademecum_history');
      } else {
        localStorage.removeItem('vademecum_concept_history');
      }
      renderHistory();
    }

    function exportData() {
      const history = localStorage.getItem('vademecum_history') || '[]';
      const conceptHistory = localStorage.getItem('vademecum_concept_history') || '[]';
      const backup = {
        meds: JSON.parse(history),
        concepts: JSON.parse(conceptHistory)
      };
      const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Vademecum_Respaldo_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        try {
          const imported = JSON.parse(event.target.result);
          if (imported.meds || imported.concepts) {
            if (imported.meds) localStorage.setItem('vademecum_history', JSON.stringify(imported.meds));
            if (imported.concepts) localStorage.setItem('vademecum_concept_history', JSON.stringify(imported.concepts));
          } else if (Array.isArray(imported)) {
            localStorage.setItem('vademecum_history', JSON.stringify(imported));
          }
          renderHistory();
          showModal('¡Respaldo importado con éxito!');
        } catch (err) {
          showModal('Error al leer el archivo JSON.');
        }
      };
      reader.readAsText(file);
    }

    function showModal(msg) {
      document.getElementById('modalMessage').innerText = msg;
      document.getElementById('customModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('customModal').classList.remove('active');
    }
  </script>
</body>
</html>
